<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>北京建筑 · 单体审查</title><style>*{box-sizing:border-box}body{margin:0;background:#ece9dc;color:#253b39;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}header{position:fixed;left:24px;top:22px;z-index:2;display:flex;gap:8px;align-items:center;background:#fffaf0e8;padding:12px 15px;border-radius:10px;box-shadow:0 3px 22px #23372e15}select,button{font:inherit;border:1px solid #adb4a5;background:#fffdf4;padding:7px 9px;border-radius:5px;color:inherit}button{cursor:pointer}aside{position:fixed;left:26px;bottom:26px;max-width:430px;background:#fffaf0e8;padding:15px 18px;border-radius:10px}h1{font-size:22px;font-weight:600;margin:0 0 5px}p{line-height:1.6;margin:5px 0}small{color:#58675d}a{color:#466e63}.clean header,.clean aside{display:none}#error{position:fixed;inset:20px;background:#fff4e5;color:#76251c;padding:25px;white-space:pre-wrap;display:none}</style></head><body><canvas id="scene"></canvas><header><strong>北京建筑审查</strong><button id="previous" aria-label="上一建筑">←</button><select id="building" aria-label="选择建筑"></select><button id="next" aria-label="下一建筑">→</button><select id="detail" aria-label="细节级别"><option value="1">近景细节</option><option value="0">标准低模</option><option value="silhouette">远景轮廓</option><option value="2">高细节</option></select><button id="front">正面</button><button id="isometric">透视</button><button id="normals">法线检查</button></header><aside><h1 id="name">加载建筑</h1><p id="features"></p><p id="stats"></p><small>米制 · 正面朝南 · 风格化近似重建<br>单面材质，保留真实几何空洞；拖动旋转，滚轮缩放</small><p><a id="reference" target="_blank" rel="noopener">真实照片来源</a></p></aside><pre id="error"></pre><script type="module" src="./review.js"></script></body></html>
